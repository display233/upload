<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>神秘界面</title>
    <link rel="stylesheet" href="log_in.css">
    <style>
        .box{
            height: 75rem;
            margin: 5vh auto;
        }
        #tion{
            width: 50%;
        }
        #button{
            width: 30%;
            height: 5rem;
            color: #f6f6f6;
            background-image: linear-gradient(120deg, #417DFB 0%, #57A3F4 100%);
            font-size: 2rem;
            border: none;
            border-radius: 0.5rem;
            margin: 5rem 0 0 0;
        }
    </style>
</head>

<body onresize="resize()">
    <span class="bgimg"></span>
    <span class="span"></span>
    <div class="box">
        <div class="left"></div>
        <div class="right">
            <h4>重  置  密  码</h4>
            <form action="backpass.php" method="post">
                <input name="mail" class="acc" type="email" maxlength="30" placeholder="电子邮箱" id="mailA" required>
                <input name="tion" class="acc" type="text" maxlength="6" placeholder="验证码" id="tion" required>
                <button id="button">获取验证码</button>
                <input name="password" class="acc" type="password" maxlength="20" placeholder="输入新密码" required>
                <input name="qpassword" class="acc" type="password" maxlength="20" placeholder="确认新密码" required>
                <input class="submit" type="submit" maxlength="10" value="register">
            </form>
            <form action="mail.php" method="post" target="rame" style="display:none">
                <input name="mail" type="email" maxlength="30" id="mailB">
                <input type="submit" id="submit">
            </form>
            <iframe name="rame" style="display:none"></iframe>
            <div class="fn">
                <a href="log_in.html">密码登录</a>
                <a href="log_inB.html">验证码登录</a>
                <a href="register.html">注册账号</a>
            </div>
        </div>
    </div>
    <script>
    let resize = () => {
    let X = window.innerWidth
    let Y = window.innerHeight
    let size = 1.53847
    if(X<Y){
        if(X<=900){
            document.getElementsByTagName('html')[0].style.fontSize=size*1+'vw'
        }else if(X>=1500){
            document.getElementsByTagName('html')[0].style.fontSize=size*0.67+'vw'
        }else{
            document.getElementsByTagName('html')[0].style.fontSize=size*0.88+'vw'
        }
        document.getElementsByClassName('span')[0].style.height=0
        document.getElementsByClassName('box')[0].style.margin=15+'vh auto'
        document.getElementsByClassName('box')[0].style.width=58.5+'rem'
        document.getElementsByClassName('left')[0].style.width=0
        document.getElementsByClassName('right')[0].style.width=100+'%'
    }else{
        if (X <= 900) {
            document.getElementsByTagName('html')[0].style.fontSize = 1 + 'vw'
        } else if (X >= 1500) {
            document.getElementsByTagName('html')[0].style.fontSize = 0.67 + 'vw'
        } else {
            document.getElementsByTagName('html')[0].style.fontSize = 0.88 + 'vw'
        }
        document.getElementsByClassName('span')[0].style.height=100+'vh'
        document.getElementsByClassName('box')[0].style.margin=5+'vh auto'
        document.getElementsByClassName('box')[0].style.width=90+'rem'
        document.getElementsByClassName('left')[0].style.width=35+'%'
        document.getElementsByClassName('right')[0].style.width=65+'%'
    }
};resize();
let mailA = document.getElementById('mailA')
let mailB = document.getElementById('mailB')
mailA.addEventListener('input', function() {
    mailB.value = mailA.value
});
let btn = document.getElementById('button')
let inp = document.getElementById('submit')
let time = 60
btn.addEventListener('click', function() {
    btn.disabled = true
    inp.click()
    inp.disabled = true
    let timer = setInterval(function() {
        if (time < 0) {
            clearInterval(timer)
            btn.disabled = false
            inp.disabled = false
            btn.innerHTML = '获取验证码'
            time = 60
        } else {
            btn.innerHTML = '还剩' + time + '秒'
            time -= 1
        }
    }, 1000)
});
    </script>
</body>

</html>
